<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111"><title>MAESTROS | Ενεργοποίηση διαχείρισης</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:#f5f5f5;font:16px/1.5 Arial,sans-serif;display:grid;place-items:center;padding:20px}main{max-width:510px;width:100%;border:1px solid #555;border-top:5px solid #ffe500;background:#191919;padding:28px;border-radius:8px}h1{font-size:34px;color:#ffe500;letter-spacing:-1.5px;margin:0}small{color:#bbb;font-size:12px;letter-spacing:1px}h2{font-size:24px;margin:24px 0 10px}p{color:#ddd}label{display:block;margin-top:15px;font-weight:bold}input{width:100%;min-height:48px;background:#0a0a0a;color:white;border:1px solid #777;padding:12px;font-size:16px;border-radius:3px;margin-top:5px}button,a.action{display:block;width:100%;min-height:48px;margin-top:18px;background:#ffe500;color:#111;border:0;border-radius:3px;padding:13px;font:700 16px Arial,sans-serif;text-decoration:none;text-align:center;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{min-height:24px;color:#ffe500;overflow-wrap:anywhere}footer{font-size:11px;color:#aaa;margin-top:28px;letter-spacing:.8px}[hidden]{display:none!important}a{color:#ffe500}input:focus,button:focus-visible,a:focus-visible{outline:2px solid #ffe500;outline-offset:3px}</style></head>
<body><main><h1>MAESTROS</h1><small>ΕΡΓΑΣΤΗΡΙΟ ΚΡΥΑΣ ΖΥΜΗΣ / BUSINESS</small><h2>Ο προσωπικός σας κωδικός</h2><p id="intro">Ενεργοποιήστε με ασφάλεια την πρόσβασή σας στον πίνακα διαχείρισης.</p><button id="verify" type="button" hidden>Επιβεβαίωση πρόσκλησης</button><form id="password-form" hidden><label for="password">Νέος κωδικός (τουλάχιστον 12 χαρακτήρες)</label><input id="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"><label for="repeat">Επιβεβαίωση κωδικού</label><input id="repeat" type="password" minlength="12" maxlength="128" required autocomplete="new-password"><button type="submit">Αποθήκευση κωδικού</button></form><p id="status" role="status" aria-live="polite"></p><a class="action" id="login" href="./orders-test.html#orders" hidden>Μετάβαση στη διαχείριση</a><footer>MAESTROS · Σχεδιασμός &amp; ανάπτυξη: KLIKZI STUDIO</footer></main>
<script>(()=>{'use strict';const CONFIG={url:"https://xehelzowzvksqdbugbhw.supabase.co", key:"sb_publishable_TWbP17TGLBwVbRy2f9vbgg__MUXV136"};const $=id=>document.getElementById(id);const params=new URLSearchParams(location.hash.slice(1));const kind=params.get('type');let hash=params.get('token_hash'),access=params.get('access_token');const validKind=['invite','recovery'].includes(kind);history.replaceState(null,'',location.pathname);let busy=false;const status=$('status'),form=$('password-form'),verify=$('verify');
async function api(path,opts={},token=null){const response=await fetch(CONFIG.url+path,{...opts,headers:{apikey:CONFIG.key,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},cache:'no-store',referrerPolicy:'no-referrer'});let data;try{data=await response.json()}catch{}if(!response.ok)throw Error('Η πρόσκληση δεν είναι έγκυρη ή έχει λήξει. Ζητήστε νέα πρόσκληση.');return data}
async function activate(){if(busy)return;busy=true;verify.disabled=true;status.textContent='Επιβεβαίωση…';try{if(hash){const result=await api('/auth/v1/verify',{method:'POST',body:JSON.stringify({type:kind,token_hash:hash})});access=result?.access_token;hash=null}if(!access)throw Error('Δεν βρέθηκε ενεργή πρόσκληση.');const allowed=await api('/rest/v1/rpc/maestros_is_admin',{method:'POST',body:'{}'},access);if(allowed!==true)throw Error('Ο λογαριασμός δεν έχει δικαιώματα διαχείρισης. Επικοινωνήστε με την τεχνική υποστήριξη.');verify.hidden=true;form.hidden=false;status.textContent='Επιλέξτε έναν ισχυρό προσωπικό κωδικό.';$('password').focus()}catch(err){access=null;hash=null;verify.hidden=true;status.textContent=err.message}finally{busy=false;verify.disabled=false}}
if(validKind&&(hash||access)){verify.hidden=false;verify.onclick=activate}else{status.textContent='Ανοίξτε τον προσωπικό σύνδεσμο ενεργοποίησης που λάβατε. Αν έληξε, ζητήστε νέο.'}
form.onsubmit=async e=>{e.preventDefault();if(busy||!access)return;const password=$('password').value,repeat=$('repeat').value;if(password!==repeat){status.textContent='Οι δύο κωδικοί δεν είναι ίδιοι.';return}if(password.length<12){status.textContent='Χρησιμοποιήστε τουλάχιστον 12 χαρακτήρες.';return}busy=true;const button=form.querySelector('button');button.disabled=true;status.textContent='Αποθήκευση…';try{await api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password})},access);try{await api('/auth/v1/logout?scope=local',{method:'POST'},access)}catch{}access=null;form.reset();form.hidden=true;$('intro').textContent='Η πρόσβασή σας είναι έτοιμη.';status.textContent='Ο κωδικός σας αποθηκεύτηκε. Μπορείτε να συνδεθείτε με το email και τον νέο κωδικό σας.';$('login').hidden=false}catch(err){status.textContent='Δεν αποθηκεύτηκε ο κωδικός. Δοκιμάστε έναν νέο, ισχυρό κωδικό ή ζητήστε νέα πρόσκληση.'}finally{busy=false;button.disabled=false}};
})();</script></body></html>
